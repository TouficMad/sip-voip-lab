# kind create cluster --name voip-lab --config kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30060   # Kamailio SIP (NodePort) -> localhost:5060/udp
        hostPort: 5060
        protocol: UDP
      - containerPort: 30300   # Grafana -> http://localhost:3000
        hostPort: 3000
        protocol: TCP
