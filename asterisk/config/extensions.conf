; Dialplan for calls coming from Kamailio.
;
;  600            echo test (hear yourself)
;  700            demo IVR prompt
;  E.164 numbers  carrier simulator: per-country answer rate and post-dial delay,
;                 so the lab produces realistic ASR / PDD / failure codes

[general]
static = yes
writeprotect = yes

[from-kamailio]
exten => 600,1,Verbose(1,Echo test from ${CALLERID(num)})
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => 700,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()

;                                    answer%  max PDD (s)
exten => _9613X.,1,Gosub(carrier,s,1(55,3))
exten => _9617[0169]X.,1,Gosub(carrier,s,1(55,3))
exten => _96181X.,1,Gosub(carrier,s,1(55,3))
exten => _961X.,1,Gosub(carrier,s,1(50,3))
exten => _44X.,1,Gosub(carrier,s,1(65,2))
exten => _33X.,1,Gosub(carrier,s,1(60,2))
exten => _971X.,1,Gosub(carrier,s,1(45,4))
exten => _X.,1,Gosub(carrier,s,1(40,3))

exten => i,1,Hangup(1)

; ARG1 = answer rate in %, ARG2 = max post-dial delay in seconds
[carrier]
exten => s,1,Set(ROLL=${RAND(1,100)})
 same => n,Wait(${RAND(0,${ARG2})})          ; post-dial delay
 same => n,GotoIf($[${ROLL} > ${ARG1} + 25 & ${ROLL} <= ${ARG1} + 30]?unallocated)
 same => n,Ringing()
 same => n,GotoIf($[${ROLL} <= ${ARG1}]?answer)
 same => n,GotoIf($[${ROLL} <= ${ARG1} + 25]?busy)
 same => n(noanswer),Wait(${RAND(2,4)})
 same => n,Hangup(19)                        ; 480 Temporarily Unavailable
 same => n(busy),Wait(1)
 same => n,Hangup(17)                        ; 486 Busy Here
 same => n(unallocated),Hangup(1)            ; 404 Not Found, rejected before ringing
 same => n(answer),Wait(${RAND(1,3)})        ; ringing time
 same => n,Answer()
 same => n,Wait(3600)                        ; the caller decides when to hang up
 same => n,Hangup()
