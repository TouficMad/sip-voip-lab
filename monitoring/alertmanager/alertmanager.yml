route:
  receiver: noc
  group_by: [alertname, dest]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: noc
    # Uncomment to send alerts to Slack:
    # slack_configs:
    #   - api_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
    #     channel: "#noc-voice"
    #     send_resolved: true
    #     title: '{{ .CommonAnnotations.summary }}'

inhibit_rules:
  # Kamailio down explains everything else
  - source_matchers: [alertname="VoipEdgeProxyDown"]
    target_matchers: [severity=~"warning|critical", alertname!="VoipEdgeProxyDown"]
