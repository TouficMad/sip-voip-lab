# Prometheus config used inside Kubernetes (docker compose uses prometheus.yml)
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/recording.yml
  - /etc/prometheus/alerts.yml

scrape_configs:
  # every pod in the namespace annotated with prometheus.io/scrape: "true"
  - job_name: voip-pods
    honor_timestamps: false
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [voip-lab]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: (.+);(.+)
        replacement: $1:$2
        target_label: __address__
      # job = app label, so the same rules and dashboard work as in docker compose
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: job
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
