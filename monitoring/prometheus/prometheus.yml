global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: kamailio
    honor_timestamps: false   # xhttp_prom adds its own timestamps
    static_configs:
      - targets: ["kamailio:9090"]

  - job_name: asterisk
    static_configs:
      - targets: ["asterisk-1:8088", "asterisk-2:8088"]
